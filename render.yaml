databases:
  - name: himasti-db
    databaseName: himasti
    user: himasti
    plan: free

services:
  - type: web
    name: himasti-web
    runtime: php
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan migrate --force"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: "https://himasti-web.onrender.com" # (User can change this if they use custom domain)
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: himasti-db
          property: connectionString
      - key: APP_KEY
        value: "base64:B5d5FOO1sEXVa5miZdADpj9rE0W4+Uc13lkaSK17oIY="
