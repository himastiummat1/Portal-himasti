name: Build HIMASTI Native Kotlin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "himasti-android/**"
      - ".github/workflows/build-kotlin-app.yml"

jobs:
  build:
    name: Build Native Kotlin Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        working-directory: himasti-android
        run: chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: himasti-android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: himasti-android/gradle-build.log

      - name: Prepare APK Output
        working-directory: himasti-android
        run: |
          mkdir -p build-output
          echo "Locating built APK files in project:"
          APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" build-output/HIMASTI-HUB-Kotlin-v1.0.apk
          else
            echo "No APK found. Inspecting build directories:"
            find . -maxdepth 4 -type d || true
            exit 1
          fi
          ls -lh build-output/

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: HIMASTI-HUB-Kotlin-v1.0-APK
          path: himasti-android/build-output/*.apk
          retention-days: 30

      - name: Auto-Publish APK Directly to Web Portal
        run: |
          mkdir -p himasti-web-laravel-backup/himasti-next/public/downloads
          cp himasti-android/build-output/HIMASTI-HUB-Kotlin-v1.0.apk himasti-web-laravel-backup/himasti-next/public/downloads/himasti.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add himasti-web-laravel-backup/himasti-next/public/downloads/himasti.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): auto-publish latest Kotlin APK to web portal [skip ci]"
            git push origin main || echo "Direct push restricted; artifact available via releases"
          else
            echo "APK is already up to date on web portal."
          fi
