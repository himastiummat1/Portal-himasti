name: Build HIMASTI Native Kotlin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "himasti-android/**"
      - ".github/workflows/build-kotlin-app.yml"

jobs:
  build:
    name: Build Native Kotlin Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-kotlin-${{ hashFiles('himasti-android/**/*.gradle*', 'himasti-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-kotlin-

      - name: Grant Execute Permission for Gradlew
        working-directory: himasti-android
        run: chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: himasti-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename Output APK
        working-directory: himasti-android
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/HIMASTI-HUB-Kotlin-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIMASTI-HUB-Kotlin-v1.0-APK
          path: himasti-android/build-output/*.apk
          retention-days: 30
