name: Build HIMASTI Native Kotlin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "himasti-android/**"
      - ".github/workflows/build-kotlin-app.yml"

jobs:
  build:
    name: Build Native Kotlin Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        working-directory: himasti-android
        run: chmod +x gradlew

      - name: Build APK with Gradle
        working-directory: himasti-android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-failure-log
          path: himasti-android/gradle-build.log

      - name: Prepare APK Output
        working-directory: himasti-android
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/HIMASTI-HUB-Kotlin-v1.0.apk
          ls -la build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIMASTI-HUB-Kotlin-v1.0-APK
          path: himasti-android/build-output/*.apk
          retention-days: 30
