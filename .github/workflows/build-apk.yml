name: Build Android APK (Capacitor Native)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "himasti-web-laravel-backup/himasti-next/android/**"
      - "himasti-web-laravel-backup/himasti-next/capacitor.config.ts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        working-directory: himasti-web-laravel-backup/himasti-next/android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: himasti-web-laravel-backup/himasti-next/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIMASTI-Native-Android-APK
          path: himasti-web-laravel-backup/himasti-next/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
